<script>
"use strict";
const STATUSES = ["", "Active", "Paused", "Blocked", "Finished", "Abandoned", "Reference"];
const OWNERSHIP = { local: "local only", fork: "fork", clone: "upstream clone" };
const STAGE_LABEL = { active: "Active", cooling: "Cooling", dormant: "Dormant", cold: "Cold" };
const HEAT_BINS = [[1, 4], [5, 19], [20, 59], [60, Infinity]];
const MONTH = new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" });

const $ = id => document.getElementById(id);
/* Set by `python3 -m dashboard --snapshot`: a read-only copy with the data embedded. */
const SNAPSHOT = window.SNAPSHOT || null;
const state = { scan: null, notes: {}, dashboards: {}, view: "all", open: null, scanning: false };

/* Everything from disk goes through textContent, never innerHTML. */
function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key in node && key !== "list") node[key] = value; /* input.list is read-only */
    else node.setAttribute(key, value);
  }
  node.append(...kids.filter(k => k !== null && k !== undefined));
  return node;
}

function bytes(n) {
  if (n == null) return "–";
  if (n < 1e6) return "<1 MB";
  if (n < 1e9) return `${Math.round(n / 1e6)} MB`;
  return n < 100e9 ? `${(n / 1e9).toFixed(1)} GB` : `${Math.round(n / 1e9)} GB`;
}

function idle(days) {
  if (days == null) return "–";
  if (days === 0) return "today";
  if (days < 60) return `${days}d ago`;
  if (days < 365) return `${Math.round(days / 30.4)} mo ago`;
  return `${(days / 365).toFixed(1)} yr ago`;
}

const date = ts => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { dateStyle: "medium" }) : "–";
const monthName = key => { const [y, m] = key.split("-"); return MONTH.format(new Date(+y, +m - 1)); };
const note = p => state.notes[p.name] || {};
const describe = p => note(p).description || p.description || "";
const hasLost = p => p.risks.some(r => r.lost);
const unsynced = p => p.risks.some(r => !r.lost) && p.ownership !== "clone";
const quiet = p => p.stage === "dormant" || p.stage === "cold";

function riskScore(p) {
  return (hasLost(p) ? 1e6 : 0) + p.unpushed + p.modified + p.untracked + p.worktree_dirty;
}

const live = () => state.scan.projects.filter(p => !p.empty);

function renderTiles() {
  const projects = live();
  const count = fn => projects.filter(fn).length;
  const total = projects.reduce((s, p) => s + (p.size || 0), 0);
  const rebuildable = projects.reduce((s, p) => s + (p.rebuildable || 0), 0);
  const unpushed = projects.filter(p => p.remote && p.ownership !== "clone").reduce((s, p) => s + p.unpushed, 0);
  const tiles = [
    { view: "active", label: "Active", value: count(p => p.stage === "active"), sub: "touched in the last 30 days" },
    { view: "quiet", label: "Gone quiet", value: count(quiet), sub: "idle for 3 months or more" },
    { view: "lost", label: "No backup at all", value: count(hasLost), sub: "only copy is on this disk" },
    { view: "unsynced", label: "Backed up, but behind", value: count(p => unsynced(p) && !hasLost(p)), sub: `${unpushed.toLocaleString()} commits waiting to push` },
    { label: "Disk, before compression", value: bytes(total), sub: `about ${bytes(rebuildable)} is rebuildable` },
  ];
  $("tiles").replaceChildren(...tiles.map(t => el("button", {
    class: `tile${t.view ? "" : " static"}${state.view === t.view ? " on" : ""}`,
    disabled: !t.view,
    "aria-pressed": String(state.view === t.view),
    onclick: () => { state.view = state.view === t.view ? "all" : t.view; renderTiles(); renderRows(); },
  }, el("div", { class: "label", textContent: t.label }),
     el("div", { class: "value", textContent: t.value }),
     el("div", { class: "sub", textContent: t.sub }))));
}

function matches(p) {
  const views = { all: () => true, active: p => p.stage === "active", quiet, lost: hasLost, unsynced: p => unsynced(p) && !hasLost(p) };
  if (!views[state.view](p)) return false;
  const scope = $("scope").value;
  if (scope === "own" && p.ownership === "clone") return false;
  if (scope === "clone" && p.ownership !== "clone") return false;
  const theme = $("theme").value;
  if (theme && note(p).theme !== theme) return false;
  const query = $("search").value.trim().toLowerCase();
  if (!query) return true;
  const n = note(p);
  return [p.name, describe(p), n.next, n.note, n.theme, p.stack].join(" ").toLowerCase().includes(query);
}

const sorters = {
  touched: (a, b) => (b.last_touched || 0) - (a.last_touched || 0),
  stale: (a, b) => (a.last_touched || 0) - (b.last_touched || 0),
  risk: (a, b) => riskScore(b) - riskScore(a),
  size: (a, b) => (b.size || 0) - (a.size || 0),
  name: (a, b) => a.name.localeCompare(b.name),
};

function heatCell(count, key) {
  const level = HEAT_BINS.findIndex(([lo, hi]) => count >= lo && count <= hi) + 1;
  const label = `${monthName(key)}: ${count} commit${count === 1 ? "" : "s"}`;
  return el("i", { class: level ? `l${level}` : "", "data-tip": label });
}

function activity(p) {
  if (!p.in_git) return el("span", { class: "heat-none", textContent: "not in git" });
  if (!p.total_commits) return el("span", { class: "heat-none", textContent: "no commits yet" });
  if (!p.my_commits) return el("span", { class: "heat-none", textContent: "no commits of yours" });
  const inRange = state.scan.months.some(m => p.months[m]);
  if (!inRange) return el("span", { class: "heat-none", textContent: "none in 12 months" });
  return el("span", { class: "heat", role: "img", "aria-label": `Commits per month for ${p.name}` },
    ...state.scan.months.map(m => heatCell(p.months[m] || 0, m)));
}

function risks(p) {
  if (!p.risks.length) return el("span", { class: "safe", textContent: "Nothing" });
  return el("div", { class: "risks" }, ...p.risks.map(r =>
    el("span", { class: `risk${r.lost ? " lost" : ""}`, textContent: r.label })));
}

function row(p) {
  const n = note(p);
  const open = state.open === p.name;
  const toggle = () => { state.open = open ? null : p.name; renderRows(); };
  const desc = describe(p);
  return el("tr", { class: `row${open ? " open" : ""}`, onclick: toggle },
    el("td", {},
      el("div", {},
        el("button", { class: "name", textContent: p.name, "aria-expanded": String(open),
          onclick: e => { e.stopPropagation(); toggle(); } }),
        state.dashboards[p.name] && !SNAPSHOT ? el("a", { class: "tag link", href: state.dashboards[p.name],
          textContent: "Dashboard", onclick: e => e.stopPropagation() }) : null,
        p.worktree_of ? el("span", { class: "tag", textContent: `worktree of ${p.worktree_of}` }) : null,
        OWNERSHIP[p.ownership] ? el("span", { class: "tag", textContent: OWNERSHIP[p.ownership] }) : null,
        n.status ? el("span", { class: "tag", textContent: n.status }) : null),
      desc ? el("div", { class: "desc", textContent: desc }) : null,
      n.next ? el("div", { class: "next", textContent: n.next }) : null),
    el("td", { class: "col-touched" },
      el("div", { class: "touched", textContent: idle(p.days_idle) }),
      el("div", { class: "via", textContent: `${STAGE_LABEL[p.stage]} · ${p.last_touched_via || "–"}` })),
    el("td", { class: "col-activity" }, activity(p)),
    el("td", {}, risks(p)),
    el("td", { class: "col-size num", textContent: bytes(p.size) }));
}

function facts(pairs) {
  const dl = el("dl", { class: "facts" });
  for (const [key, value] of pairs) {
    if (value === null || value === undefined || value === "") continue;
    dl.append(el("dt", { textContent: key }), el("dd", {}, value));
  }
  return dl;
}

function saveField(p, flash) {
  return async event => {
    const { name, value } = event.target;
    if ((note(p)[name] || "") === value.trim()) return;
    flash.textContent = "Saving…";
    try {
      const res = await post("/api/note", { name: p.name, fields: { [name]: value } });
      state.notes[p.name] = res.note;
      flash.textContent = "Saved";
      syncThemes();
    } catch (e) {
      flash.textContent = `Not saved: ${e.message}`;
    }
  };
}

function field(p, flash, label, name, control) {
  const n = note(p);
  control.name = name;
  control.value = n[name] || "";
  control.addEventListener("change", saveField(p, flash));
  return el("label", {}, label, control);
}

function copyButton(p, flash) {
  const command = `cd ${JSON.stringify(p.path)} && claude`;
  return el("button", { textContent: "Copy Claude command", onclick: async () => {
    try { await navigator.clipboard.writeText(command); flash.textContent = "Copied"; }
    catch { flash.textContent = command; }
  } });
}

function detail(p) {
  const flash = el("span", { class: "flash" });
  const branchInfo = p.in_git
    ? `${p.branch || "detached"}${p.branches > 1 ? ` (${p.branches} branches)` : ""}${p.worktrees ? `, ${p.worktrees} worktree${p.worktrees > 1 ? "s" : ""}` : ""}`
    : null;
  const lastCommit = p.last_commit_ts ? `${date(p.last_commit_ts)}: ${p.last_commit_subject}` : null;
  const left = el("div", {},
    el("h3", { textContent: "Where you left off" }),
    facts([
      ["Last commit", lastCommit],
      ["Last file edit", p.file_path ? el("span", {}, `${date(p.file_ts)}: `, el("code", { textContent: p.file_path })) : null],
      ["Claude sessions", p.claude_sessions ? `${p.claude_sessions}, last ${date(p.claude_ts)}` : null],
      ["Pick up from", p.docs.length ? el("code", { textContent: p.docs.join("  ") }) : null],
      ["Branch", branchInfo],
      ["Remote", p.remote],
      ["Stack", p.stack],
    ]),
    p.files.length ? el("h3", { textContent: `Uncommitted (${p.modified} changed, ${p.untracked} untracked)` }) : null,
    p.files.length ? el("ul", { class: "files" }, ...p.files.map(f => el("li", {}, el("code", { textContent: f })))) : null,
    p.worktree_dirty ? el("p", { textContent: `Plus ${p.worktree_dirty} uncommitted in worktrees.` }) : null,
    el("h3", { textContent: "Disk", style: "margin-top:14px" }),
    facts(p.largest.map(c => [bytes(c.size), el("code", { textContent: c.name })])));

  if (SNAPSHOT) {
    const n = note(p);
    const shown = [["Status", n.status], ["Theme", n.theme], ["Next step", n.next], ["Notes", n.note]];
    const right = el("div", {},
      el("h3", { textContent: "Your notes" }),
      ...shown.flatMap(([label, value]) => [
        el("div", { class: "via", textContent: label }),
        el("p", { class: "readonly-note", textContent: value || "" })]),
      el("div", { class: "actions" }, copyButton(p, flash), flash));
    return el("tr", { class: "detail" }, el("td", { colSpan: 5 }, el("div", { class: "detail-grid" }, left, right)));
  }
  const statusSelect = el("select", {}, ...STATUSES.map(s => el("option", { value: s, textContent: s || "Not set" })));
  const right = el("div", { class: "form" },
    el("h3", { textContent: "Your notes" }),
    el("div", { class: "two" },
      field(p, flash, "Status", "status", statusSelect),
      field(p, flash, "Theme", "theme", el("input", { type: "text", list: "themes" }))),
    field(p, flash, "Next step", "next", el("input", { type: "text" })),
    field(p, flash, "Description", "description", el("input", { type: "text", placeholder: p.description || "" })),
    field(p, flash, "Notes", "note", el("textarea", {})),
    el("div", { class: "actions" },
      el("button", { textContent: "Open in PyCharm", onclick: async () => {
        try { await post("/api/open", { name: p.name }); flash.textContent = "Opening…"; }
        catch (e) { flash.textContent = e.message; }
      } }),
      copyButton(p, flash),
      flash));
  return el("tr", { class: "detail" }, el("td", { colSpan: 5 }, el("div", { class: "detail-grid" }, left, right)));
}

function renderRows() {
  const shown = live().filter(matches).sort(sorters[$("sort").value]);
  const rows = shown.flatMap(p => state.open === p.name ? [row(p), detail(p)] : [row(p)]);
  if (!rows.length) rows.push(el("tr", {}, el("td", { colSpan: 5, class: "notice", textContent: "No projects match." })));
  $("rows").replaceChildren(...rows);
  $("count").textContent = `${shown.length} of ${live().length}`;
  const empties = state.scan.projects.filter(p => p.empty).map(p => p.name);
  $("empties").textContent = empties.length ? `Empty folders: ${empties.join(", ")}` : "";
}

function syncThemes() {
  const themes = [...new Set(Object.values(state.notes).map(n => n.theme).filter(Boolean))].sort();
  const select = $("theme");
  const current = select.value;
  select.replaceChildren(el("option", { value: "", textContent: "All themes" }),
    ...themes.map(t => el("option", { value: t, textContent: t })));
  select.value = themes.includes(current) ? current : "";
  $("themes").replaceChildren(...themes.map(t => el("option", { value: t })));
}

function renderLegend() {
  const months = state.scan.months;
  $("activity-head").textContent = `Your commits, ${monthName(months[0])} to ${monthName(months[months.length - 1])}`;
  $("legend").replaceChildren("Fewer ",
    ...[1, 2, 3, 4].map(i => el("i", { style: `background:var(--heat-${i})`, "data-tip": `${HEAT_BINS[i - 1][0]}${HEAT_BINS[i - 1][1] === Infinity ? "+" : `–${HEAT_BINS[i - 1][1]}`} commits` })),
    " More");
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function applyStatus(data) {
  state.scanning = data.scanning;
  $("rescan").disabled = data.scanning;
  $("rescan").textContent = data.scanning ? "Scanning…" : "Rescan";
  $("error").hidden = !data.error;
  $("error").textContent = data.error || "";
  if (state.scan) $("scanned").textContent = `${SNAPSHOT ? "Read-only snapshot, scanned" : "Scanned"} ${new Date(state.scan.scanned_at * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}`;
}

async function load() {
  const data = SNAPSHOT || await (await fetch("/api/data")).json();
  const fresh = data.scan && data.scan.scanned_at !== state.scan?.scanned_at;
  state.scan = data.scan;
  state.dashboards = data.dashboards || {};
  if (!Object.keys(state.notes).length) state.notes = data.annotations;
  applyStatus(data);
  /* Redrawing an open row would drop what's being typed into it. */
  if (fresh) {
    syncThemes(); renderLegend(); renderTiles();
    if (!state.open) renderRows();
  }
  if (data.scanning) setTimeout(load, 700);
}

if (SNAPSHOT) $("rescan").hidden = true;
$("rescan").addEventListener("click", async () => { await post("/api/scan", {}); load(); });
for (const id of ["search", "theme", "scope", "sort"]) {
  $(id).addEventListener("input", () => { if (state.scan) renderRows(); });
}
const tip = $("tip");
document.addEventListener("mouseover", e => {
  const target = e.target.closest?.("[data-tip]");
  if (!target) { tip.style.display = "none"; return; }
  tip.textContent = target.dataset.tip;
  tip.style.display = "block";
  const box = target.getBoundingClientRect(), own = tip.getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - own.width - 8, Math.max(8, box.left + box.width / 2 - own.width / 2))}px`;
  tip.style.top = `${box.top - own.height - 6}px`;
});
load().catch(e => { $("error").hidden = false; $("error").textContent = `Could not reach the server: ${e.message}`; });
</script>
